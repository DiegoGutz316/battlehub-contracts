# CI del microfrontend (ADR-003 §1: Node desde .nvmrc = 24).
# Si el repo también tiene la API en .NET 10, agreguen el job de backend de 05-cicd-testing-commits.md.
name: CI - Frontend

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx jest --ci
